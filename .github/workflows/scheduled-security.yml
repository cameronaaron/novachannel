name: Scheduled security checks

# Daily cargo audit: a dependency can gain an advisory while Cargo.lock sits
# unchanged on main, which a per-commit audit never sees. Fuzzing runs in
# cflite_pr.yml and cflite_batch.yml.

on:
  schedule:
    # Off the hour to avoid the :00 rush.
    - cron: "17 7 * * *"
  workflow_dispatch: {}

concurrency:
  group: scheduled-security-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit (workspace + fuzz crate)
        run: |
          cargo audit
          cargo audit --file crates/core/fuzz/Cargo.lock
