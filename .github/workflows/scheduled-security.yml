name: Scheduled security checks

# cargo audit: a dependency can go from "clean" to "has a disclosed CVE" on
# a day nobody touches this repo. ENGINEERING-STANDARDS.md's convention of
# running `cargo audit` before a commit only catches advisories that
# already existed *at commit time* — it says nothing about the weeks or
# months after, while the same Cargo.lock keeps sitting on main. This job
# re-checks it daily regardless of whether anything changed.
#
# Sustained fuzzing itself now lives in cflite_pr.yml (on every PR) and
# cflite_batch.yml (every 6 hours) via ClusterFuzzLite instead of the
# hand-rolled `fuzz:` job this file used to carry — that job only ever
# covered 6 of this workspace's 8 targets (`rln_verify`/`mpc_frost_verify`
# were added later and never backfilled into its matrix) and ran each for
# 180 seconds once a day; ClusterFuzzLite auto-discovers every target
# under crates/core/fuzz/fuzz_targets/ and runs each for up to an hour per
# batch run, with proper crash triage instead of a bare `cargo fuzz run`.

on:
  schedule:
    # 07:17 UTC daily -- arbitrary off-the-hour time, avoids the
    # top-of-hour thundering herd of jobs scheduled at :00.
    - cron: "17 7 * * *"
  workflow_dispatch: {}

concurrency:
  group: scheduled-security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit (workspace + fuzz crate)
        run: |
          cargo audit
          cargo audit --file crates/core/fuzz/Cargo.lock
