[package]
name = "novachannel-oram"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Path ORAM: an O(log n)-per-access oblivious storage layer for server-side per-user state."

[lints]
workspace = true

[dependencies]
rand = "0.10"
sha2 = "0.11"
# `EncryptingServerStorage`'s confidentiality layer -- same AEAD crate and
# version this workspace already uses everywhere else (`novachannel`,
# `novachannel-mpc`).
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
zeroize = "1"

[dev-dependencies]
rand_chacha = "0.10"
