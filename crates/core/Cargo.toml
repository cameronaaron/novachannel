[package]
name = "novachannel"
version = "0.1.0"
edition = "2021"
description = "A hybrid classical/post-quantum secure channel: authenticated key exchange plus an AEAD transport."
license = "MIT OR Apache-2.0"

[lints]
workspace = true

[dependencies]
# Classical AEAD for the data-plane transport. `zeroize` clears the
# expanded key schedule on drop — without it, ChaCha20Poly1305's internal
# state (derived directly from every AEAD key in this crate) outlives the
# raw key bytes it was built from, even where the wrapping struct zeroizes
# those.
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
# Key derivation for the handshake -> transport key schedule.
hkdf = "0.13"
sha2 = "0.11"
# Classical authentication + key exchange.
ed25519-dalek = { version = "3", features = ["rand_core"] }
x25519-dalek = { version = "3", features = ["static_secrets", "reusable_secrets", "zeroize"] }
# Post-quantum authentication (ML-DSA-87, FIPS 204) + key exchange (ML-KEM-1024,
# FIPS 203) — the final NIST-ratified standards (as of the 2024 finalization),
# not the pre-standardization "Dilithium"/"Kyber" round-3 submissions this
# crate used before. Pure Rust (RustCrypto), no C FFI, composed with the
# classical primitives above so breaking either alone is insufficient.
# `zeroize` on both: without it, neither crate's SigningKey/DecapsulationKey
# actually clears its secret state on drop (their `Drop` impls are entirely
# feature-gated) despite `identity.rs`/`kex.rs` assuming they do.
ml-dsa = { version = "0.1", features = ["zeroize"] }
ml-kem = { version = "0.3", features = ["zeroize"] }
kem = "0.3"
# HMAC-based hash ratchet for the per-message chain key in `ratchet` —
# already a transitive dependency of `hkdf`, declared directly here because
# `ratchet.rs` calls it itself rather than going through HKDF-expand.
hmac = "0.13"
rand_core = "0.10"
getrandom = { version = "0.4", features = ["sys_rng"] }
zeroize = { version = "1", features = ["derive"] }
thiserror = "2"
reed-solomon-simd = "3.1.0"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }

[[example]]
name = "echo"
path = "examples/echo.rs"
